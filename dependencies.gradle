/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    // Hard dependencies, pinned to GTNH 2.9.0-RC-2 (reference/gtnh/2.9.0-RC-2/MOD-INDEX.md).
    // devOnlyNonPublishable: needed to compile and in runClient/runServer; the pack supplies them at runtime.
    devOnlyNonPublishable("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.205:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.11.52:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:ModularUI2:2.3.92-1.7.10:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.155-GTNH:dev")
    devOnlyNonPublishable("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")

    // Optional integration (M6): team status for turret and charge friends. compileOnly, so the mod is absent from
    // runServer and the adapter loads only behind Loader.isModLoaded("serverutilities") (GGS-09-06).
    compileOnly("com.github.GTNewHorizons:ServerUtilities:2.4.14:dev") { transitive = false }

    // Optional integration (0.3.1): installs the GregGuns quest line into BetterQuesting's database (design record 0015).
    // compileOnly, so BetterQuesting is absent from runServer and its classes load only behind
    // Loader.isModLoaded("betterquesting"). Version is the pack's (reference/gtnh/2.9.0-RC-2/MOD-INDEX.md).
    compileOnly("com.github.GTNewHorizons:BetterQuesting:3.8.89-GTNH:dev") { transitive = false }

    // Optional integration (ICBM module, I0): Galacticraft is the ICBM module's hard gate (modules.icbm turns itself off
    // without it, D9) and OpenComputers is its optional scripting hook (D13). compileOnly plus runtimeOnlyNonPublishable, so both
    // compile and run in runServer/runClient but are not published as dependencies; all references to them are isolated behind
    // Loader.isModLoaded and @Optional. Versions are the pack's (reference/gtnh/2.9.0-RC-2/MOD-INDEX.md).
    // To test the absent-Galacticraft case, run: ./gradlew runServer -PnoGalacticraft (see docs/testing/README.md).
    // The flag only drops the runtime copy; the compile classpath keeps the jars so the source set always builds.
    compileOnly("com.github.GTNewHorizons:Galacticraft:3.4.34-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:OpenComputers:1.12.64-GTNH:dev") { transitive = false }
    if (!project.hasProperty("noGalacticraft")) {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Galacticraft:3.4.34-GTNH:dev")
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:OpenComputers:1.12.64-GTNH:dev")
    }

    // The pack's Vending Machine, so dev runs and the compat.vending scenarios have the trade database that the GregGuns
    // trades are merged into (com.gregguns.compat.VendingMachineCompat). Runtime only: GregGuns reaches it by reflection.
    // Version is the pack's (MOD-INDEX.md).
    runtimeOnlyNonPublishable("com.cubefury.vendingmachine:VendingMachine:0.4.101:dev") { transitive = false }

    // Optional integration (D312): Mobs Info's NEI mob page shows the NPC gun drops through IMobExtraInfoProvider on our
    // LivingDropsEvent handler (com.gregguns.entity.npc.NpcGunDropsHandler). compileOnly, so the mod is absent from the
    // default runs and its types load only behind @Optional. Opt in to a dev run with -Pgg.devMobsInfo=true (or env
    // GG_DEV_MOBSINFO=1): its all-mob drop simulation is slow at boot. Version is the pack's (MOD-INDEX.md).
    compileOnly("com.github.GTNewHorizons:Mobs-Info:0.6.0-GTNH:dev") { transitive = false }
    if (project.hasProperty("gg.devMobsInfo") || System.getenv("GG_DEV_MOBSINFO") == "1") {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Mobs-Info:0.6.0-GTNH:dev")
    }

    // EnhancedLootBags and its YAMCore library, so dev runs and scenarios have the pack's bag item that the GregGuns loot
    // groups are added to (com.gregguns.compat.lootbags). Runtime only: GregGuns reaches ELB by reflection.
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:EnhancedLootBags:1.3.5:dev") { transitive = false }
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Yamcl:0.7.5:dev") { transitive = false }
    // Carpenter's Blocks: the silo complex's blast doors are its garage doors (D335), placed by name; the dev runs and
    // scenarios load it so icbm.complex.fixtures can read the doors back.
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:CarpentersBlocks:3.7.3-GTNH:dev") { transitive = false }
    // The pack's Backpack mod, so dev runs and the armor and repair scenarios have Tanned Leather (Backpack:tannedLeather),
    // the lining of the armor recipes. Runtime only: GregGuns looks the item up by name (com.gregguns.compat.PackItems).
    // Version is the pack's (MOD-INDEX.md).
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Minecraft-Backpack-Mod:2.6.18-GTNH:dev") { transitive = false }

    // Dev-client CTM (design record 0023): Angelica 2.2.28 bundles MCPatcherForge, which renders our connected-texture
    // data. Opt in with -Pgg.devAngelica=true (or env GG_DEV_ANGELICA=1); off by default, so builds, tests, runServer and the
    // headless suite are unchanged. Runtime only, client side (Angelica is a CLIENT mod). Version is the pack's.
    if (project.hasProperty("gg.devAngelica") || System.getenv("GG_DEV_ANGELICA") == "1") {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.2.28:dev")
    }

    // Unit tests (CONTRIBUTING.md, Testing): JUnit 5, same BOM as GT5-Unofficial 5.09.54.205.
    testImplementation(platform("org.junit:junit-bom:5.14.1"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // Config and network tests need GTNHLib's annotations and IPacket/NetworkChannel types at test runtime.
    testImplementation("com.github.GTNewHorizons:GTNHLib:0.11.52:dev")
    // GT's pure voltage tables (GTValues, TierEU, VoltageIndex) so tier tests compare against GT itself, not a copy.
    testImplementation("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.205:dev") { transitive = false }
}
